<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 88">
  <!-- Upper-left diagonal chevrons (dark blue) — rendered before squares so squares cover any edge overlap -->
  <polygon points="0,2 46,2 58,17 12,17"   fill="rgba(255,255,255,0.75)"/>
  <polygon points="6,24 52,24 64,39 18,39"  fill="rgba(255,255,255,0.75)"/>

  <!-- Lower-right diagonal chevrons -->
  <polygon points="42,50 88,50 100,65 54,65" fill="rgba(255,255,255,0.75)"/>
  <polygon points="48,72 94,72 100,86 54,86" fill="rgba(255,255,255,0.75)"/>

  <!-- Upper-right square (full white) -->
  <rect x="60" y="2"  width="40" height="40" fill="#ffffff"/>

  <!-- Lower-left square (full white) -->
  <rect x="0"  y="46" width="40" height="40" fill="#ffffff"/>
</svg>
