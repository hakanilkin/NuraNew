<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management – Surgical Services</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-vdivider"></div>
      <h1>User Management</h1>
      <nav class="header-nav">
        <a href="index.html">Operational Performance</a>
        <a href="capacity.html">Capacity</a>
        <a href="blockutil.html">Block Utilization</a>
        <span class="nav-active">Admin</span>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="admin-toolbar">
        <h2>Users</h2>
        <button class="apply-btn" id="new-user-btn">+ New User</button>
      </div>

      <div id="user-status" class="status-msg">Loading&hellip;</div>

      <div class="table-wrap">
        <table id="users-table" class="hidden">
          <thead>
            <tr>
              <th>Username</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Admin</th>
              <th>Active</th>
              <th>MFA</th>
              <th>Last Login</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ── Modal ──────────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">New User</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div id="modal-error" class="auth-error hidden"></div>
      <div id="modal-success" class="auth-success hidden"></div>
      <form id="user-form">
        <input type="hidden" id="edit-user-id" value="" />
        <div class="modal-field">
          <label>Username <span class="req">*</span></label>
          <input type="text" id="f-username" required />
        </div>
        <div class="modal-field">
          <label>Full Name</label>
          <input type="text" id="f-fullname" />
        </div>
        <div class="modal-field">
          <label>Email</label>
          <input type="email" id="f-email" />
        </div>
        <div class="modal-field" id="pwd-field">
          <label>Password <span class="req">*</span></label>
          <input type="password" id="f-password" minlength="8" />
          <div class="modal-hint" id="pwd-hint">Leave blank to keep current password</div>
        </div>
        <div class="modal-row">
          <label class="modal-check">
            <input type="checkbox" id="f-isadmin" />
            Administrator
          </label>
          <label class="modal-check">
            <input type="checkbox" id="f-isactive" checked />
            Active
          </label>
        </div>
        <div id="reset-totp-wrap" class="modal-row hidden">
          <label class="modal-check">
            <input type="checkbox" id="f-reset-totp" />
            Reset MFA (force re-enroll)
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-cancel" id="modal-cancel">Cancel</button>
          <button type="submit" class="apply-btn" id="modal-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
  <script src="nav-auth.js"></script>
</body>
</html>
