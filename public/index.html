<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surgical Services Operational Performance</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="capacity.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="header-brand">
      </a>
      <div class="header-vdivider"></div>
      <h1>Surgical Services Operational Performance</h1>
      <nav class="header-nav">
        <span class="nav-active">Operational Performance</span>
        <a href="capacity.html">Capacity</a>
        <a href="blockutil.html">Block Utilization</a>
        <a href="blazesql.html">Analytics</a>
        <a href="admin.html" id="nav-admin" class="hidden">Admin</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- ── Filters ──────────────────────────────────────────────── -->
    <section class="card filter-bar">
      <div class="filter-row">

        <div class="filter-group">
          <label class="filter-label" for="start-date">From</label>
          <input type="date" id="start-date" class="date-input" value="2025-01-01" />
        </div>

        <div class="filter-group">
          <label class="filter-label" for="end-date">To</label>
          <input type="date" id="end-date" class="date-input" value="2025-12-31" />
        </div>

        <div class="filter-group">
          <label class="filter-label">Sites</label>
          <div class="ms-wrap" id="ms-wrap">
            <button type="button" class="ms-btn" id="ms-btn">
              <span id="ms-label">All Sites</span>
              <span class="ms-caret">&#9660;</span>
            </button>
            <div class="ms-menu hidden" id="ms-menu"></div>
          </div>
        </div>

        <button id="apply-btn" class="apply-btn">Apply</button>

      </div>
    </section>

    <!-- ── Summary Table ───────────────────────────────────────────── -->
    <section class="card">
      <h2>Cases Summary by Site</h2>
      <div id="table-status" class="status-msg">Loading&hellip;</div>
      <div class="table-wrap">
        <table id="summary-table" class="hidden">
          <thead>
            <tr>
              <th>Site</th>
              <th>Total Cases</th>
              <th>Total OR Duration (min)</th>
              <th>Avg OR Duration (min)</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td><strong>Grand Total</strong></td>
              <td id="foot-cases"></td>
              <td id="foot-duration"></td>
              <td id="foot-avg"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>

    <!-- ── Monthly Trend Chart ─────────────────────────────────────── -->
    <section class="card">
      <h2 id="trend-title">Monthly Case Volume</h2>
      <div id="chart-status" class="status-msg">Loading&hellip;</div>
      <div class="chart-wrap">
        <canvas id="trend-chart"></canvas>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
  <script src="nav-auth.js"></script>
</body>
</html>
